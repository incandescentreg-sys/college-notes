<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дарья Измайлова — колледж</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --text:#1f2937; --muted:#6b7280;
    --accent:#4b5563; --accent-2:#374151; --accent-contrast:#fff;
    --accent-soft:#eef0f3;
    --line:#e4e7ec; --hover:#eef0f3; --focus:#c3cad4;
    --danger:#b91c1c; --danger-bg:#fde8e8; --danger-line:#f5c2c2;
    --ok:#15803d; --ok-bg:#dcfce7; --ok-line:#bbf7d0;
    --soon:#b45309; --soon-bg:#fef3c7; --soon-line:#fde68a;
    --exam:#6d28d9; --exam-bg:#ede9fe; --exam-line:#ddd6fe;
    --points:#0369a1; --points-bg:#e0f2fe; --points-line:#bae6fd;
    --bar-bg:#e8eaef; --file-bg:#f6f7f9; --drop-bg:#fafbfc; --drop-line:#c3cad4;
    --chip-bg:#eef0f3; --chip-line:#d5d9df; --chip-text:#374151;
    --veil:rgba(15,23,42,.45); --toast-bg:#1f2937; --toast-text:#fff;
    --shadow:0 1px 3px rgba(15,23,42,.07),0 8px 24px rgba(15,23,42,.05);
    --radius:14px;
  }
  [data-theme="dark"]{
    --bg:#0f1115; --card:#171a20; --text:#e6e8ec; --muted:#9aa1ad;
    --accent:#94a3b8; --accent-2:#7f8d9f; --accent-contrast:#0f1115;
    --accent-soft:#22262e;
    --line:#262b33; --hover:#232830; --focus:#3d4450;
    --danger:#f87171; --danger-bg:#3a1d1d; --danger-line:#5f2b2b;
    --ok:#4ade80; --ok-bg:#14301f; --ok-line:#25663f;
    --soon:#fbbf24; --soon-bg:#382d13; --soon-line:#63521b;
    --exam:#c4b5fd; --exam-bg:#2a2440; --exam-line:#4a3d6b;
    --points:#7dd3fc; --points-bg:#0e2a3a; --points-line:#1d4e6b;
    --bar-bg:#272c35; --file-bg:#1e232b; --drop-bg:#171a20; --drop-line:#3c4350;
    --chip-bg:#21262f; --chip-line:#343b47; --chip-text:#c9d0da;
    --veil:rgba(0,0,0,.6); --toast-bg:#e6e8ec; --toast-text:#111827;
    --shadow:0 1px 3px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;z-index:50;background:var(--accent);color:var(--accent-contrast);padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sub{font-size:12px;opacity:.8;font-weight:400}
  .hdr-right{display:flex;align-items:center;gap:10px;margin-left:auto}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .card h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .count{font-size:12px;color:var(--muted);background:var(--accent-soft);padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
  .bar{height:6px;border-radius:99px;background:var(--bar-bg);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
  .tag{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:inline-block}
  .tag.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
  .tag.soon{background:var(--soon-bg);color:var(--soon);border-color:var(--soon-line)}
  .tag.danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-line)}
  .tag.exam{background:var(--exam-bg);color:var(--exam);border-color:var(--exam-line)}
  .tag.points{background:var(--points-bg);color:var(--points);border-color:var(--points-line)}
  .btn{border:none;cursor:pointer;font-size:13px;font-weight:600;border-radius:10px;padding:8px 14px;transition:filter .15s,transform .1s;color:var(--accent-contrast);background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:var(--danger-bg);color:var(--danger)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .theme-btn{border:none;cursor:pointer;background:rgba(0,0,0,.14);color:inherit;border-radius:10px;padding:6px 10px;font-size:15px;line-height:1}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .search{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--card);color:var(--text)}
  .search:focus{outline:2px solid var(--focus);border-color:var(--accent)}
  select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:14px}
  #app{display:grid;grid-template-columns:0px 1fr;gap:20px}
  #app.side-open{grid-template-columns:240px 1fr}
  aside{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;align-self:start;position:sticky;top:74px;max-height:calc(100vh - 90px);overflow:auto}
  aside h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 8px}
  aside ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  aside li a{display:block;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--text);font-size:14px;cursor:pointer}
  aside li a:hover{background:var(--hover)}
  aside li a.active{background:var(--accent);color:var(--accent-contrast)}
  #content{min-width:0}
  .subject-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .subject-head h2{margin:0;font-size:22px}
  .entries{display:flex;flex-direction:column;gap:12px}
  .entry{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
  .entry .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .entry .title{font-weight:700;font-size:15px}
  .entry .desc{font-size:14px;color:var(--text);white-space:pre-wrap}
  .entry .duedate{font-size:13px;color:var(--muted)}
  .files{margin-top:6px;display:flex;flex-direction:column;gap:6px}
  .file-row{display:flex;align-items:center;gap:8px;background:var(--file-bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
  .file-row a{color:var(--accent);text-decoration:none;word-break:break-all;flex:1}
  .file-row a:hover{text-decoration:underline}
  .file-row .fsize{color:var(--muted);white-space:nowrap}
  .file-ico{font-size:15px}
  .drop{border:2px dashed var(--drop-line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:var(--drop-bg);transition:.15s}
  .drop:hover,.drop.drag{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .uploaded-chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip-bg);border:1px solid var(--chip-line);color:var(--chip-text);border-radius:999px;padding:4px 10px;font-size:12px;margin-top:8px}
  .uploaded-chip button{border:none;background:none;color:inherit;cursor:pointer;font-weight:700}
  .entry.overdue{border-left:4px solid var(--danger)}
  .entry.done{opacity:.62}
  .entry.done .title{text-decoration:line-through}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .empty .big{font-size:40px;margin-bottom:8px}
  .modal-bg{position:fixed;inset:0;background:var(--veil);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto}
  .modal-bg.open{display:flex}
  .modal{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:520px;padding:22px}
  .modal h2{margin:0 0 16px;font-size:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
  .field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text)}
  .field textarea{min-height:90px;resize:vertical}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--toast-bg);color:var(--toast-text);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:200;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .sync{font-size:11px;font-weight:600;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.14);white-space:nowrap}
  .sync.ok{background:rgba(34,197,94,.28)}
  .sync.err{background:rgba(239,68,68,.35)}
  .export-actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
  .ov-bg{position:fixed;inset:0;background:var(--veil);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:110;overflow:auto}
  .ov-bg.open{display:flex}
  .ov{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);width:100%;min-width:0;padding:18px}
  .ov.norm{max-width:860px}
  .ov.wide{max-width:1100px}
  .pv-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:15px;flex-wrap:wrap}
  .pv-body{text-align:center}
  .pv-body img{max-width:100%;max-height:70vh;border-radius:8px;display:inline-block}
  .pv-body iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
  .pv-body pre{text-align:left;white-space:pre-wrap;word-break:break-word;max-height:68vh;overflow:auto;font-size:13px;background:var(--file-bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0}
  .xls-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .xls-tabs{display:flex;gap:6px;overflow-x:auto;flex:1 1 auto;min-width:0;-webkit-overflow-scrolling:touch}
  .xls-tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
  .xls-tabs button.active{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)}
  .xls-tools{display:flex;gap:6px;flex:none;margin-left:auto}
  .xls-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;min-width:40px}
  .xls-btn.on{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)}
  .pv-body .xls-wrap{--xz:15px;max-width:100%;max-height:70vh;overflow:auto;-webkit-overflow-scrolling:touch;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .pv-body table.xls{border-collapse:separate;border-spacing:0;font-size:var(--xz);line-height:1.4;color:var(--text);min-width:100%}
  .pv-body table.xls td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:.55em .75em;vertical-align:top;text-align:left;white-space:normal;overflow-wrap:break-word;min-width:4em;max-width:16em}
  .pv-body table.xls td:first-child{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--line)}
  .pv-body table.xls tr:nth-child(even) td:first-child{background:var(--file-bg)}
  .pv-body table.xls tr.hd td:first-child{z-index:2;background:var(--accent-soft)}
  .pv-body table.xls tr:nth-child(even) td{background:var(--file-bg)}
  .pv-body table.xls td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:3em}
  .pv-body table.xls tr.hd td{background:var(--accent-soft);font-weight:700;position:sticky;top:0;z-index:1;vertical-align:middle}
  .pv-body table.xls tr.gap td{background:transparent;border-right-color:transparent;padding:.2em}
  .pv-body .xls-wrap.nowrap table.xls td{white-space:nowrap;max-width:none}
  .xls-note{font-size:12px;color:var(--muted);margin-top:6px;text-align:left}
  .xls-empty{text-align:center;padding:24px;color:var(--muted)}
  .pdf-box{display:flex;flex-direction:column;gap:10px}
  .pdf-box .pdf-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--file-bg);border:1px solid var(--line);border-radius:8px;padding:8px;position:sticky;top:0;z-index:2}
  .pdf-box .pdf-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;min-width:38px}
  .pdf-box .pdf-btn:disabled{opacity:.4;cursor:default}
  .pdf-box .pdf-page{text-align:center;overflow:auto}
  .pdf-box canvas{max-width:100%;height:auto;box-shadow:var(--shadow);border-radius:4px;background:#fff;touch-action:pan-y}
  .sch-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .sch-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
  .sch-day{background:var(--file-bg);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px;display:flex;flex-direction:column;gap:6px}
  .sch-day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .sch-day h4{margin:0;font-size:13px;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
  .sch-add{border:none;background:var(--accent);color:var(--accent-contrast);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;font-weight:700}
  .sch-lesson{position:relative;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer}
  .sch-lesson .t{font-weight:700;color:var(--accent)}
  .sch-lesson .rm{color:var(--muted);font-size:11px}
  .sch-lesson.off{opacity:.38;filter:grayscale(.6)}
  .sch-lesson.off:hover{opacity:.7}
  .sch-del{position:absolute;top:4px;right:4px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px}
  .sch-del:hover{color:var(--danger)}
  @media(max-width:760px){#app{grid-template-columns:1fr!important}aside{position:static;max-height:none;order:-1}
    .ov-bg{padding:12px 8px}.ov{padding:12px}
    #pvBg{padding:0}#pvBg .ov{border-radius:0;min-height:100%;padding:12px 12px 20px;box-shadow:none}
    #pvBg .pv-body .xls-wrap{max-height:calc(100dvh - 150px)}
    .pv-body table.xls td:first-child:not([colspan]){min-width:6em!important;max-width:40vw}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Дарья Измайлова</h1>
    <div class="sub">Задания, заметки и материалы по предметам колледжа</div>
  </div>
  <div class="hdr-right">
    <span id="syncState" class="sync" title="Статус синхронизации">…</span>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Переключить тему">🌓</button>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <input id="search" class="search" type="search" placeholder="Поиск по названию, описанию, предмету…" oninput="renderAll()">
    <select id="statusFilter" onchange="renderAll()">
      <option value="all">Все статусы</option>
      <option value="current">Активные</option>
      <option value="overdue">Просроченные</option>
      <option value="done">Выполненные</option>
    </select>
    <button class="btn" onclick="openModal('subject')">+ Предмет</button>
    <button class="btn" onclick="openModal('task')">+ Задание</button>
    <button class="btn" onclick="openSchedule()">📅 Расписание</button>
    <button class="btn ghost sm" onclick="exportData()">Экспорт JSON</button>
    <button class="btn ghost sm" onclick="toggleSidebar()">☰</button>
  </div>

  <div id="app" class="side-open">
    <aside id="sidebar">
      <h2>Предметы</h2>
      <ul id="subjectList"></ul>
      <h2>Фильтры</h2>
      <ul>
        <li><a data-filter="upcoming" onclick="setFilter(this,'upcoming')">Ближайшие дедлайны</a></li>
        <li><a data-filter="overdue" onclick="setFilter(this,'overdue')">Просрочено</a></li>
        <li><a data-filter="all" onclick="setFilter(this,'all')">Всё</a></li>
      </ul>
    </aside>

    <main id="content"></main>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="ov-bg" id="pvBg" onclick="if(event.target===this)closePreview()">
  <div class="ov norm" id="pv"></div>
</div>
<div class="ov-bg" id="schBg" onclick="if(event.target===this)closeSch()">
  <div class="ov wide" id="sch"></div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const LS_KEY='college_data_v1';
let data={subjects:[],tasks:[],schedule:{}};
let state={view:'all',subject:null,filter:'all',sideOpen:true};
let pendingFiles=[];
let syncTimer=null;

const API_PATH='/api/data';

function setSync(text,cls){const el=document.getElementById('syncState');if(el){el.textContent=text;el.className='sync '+(cls||'');}}

async function load(){
  data.subjects=[];data.tasks=[];
  const cached=localStorage.getItem(LS_KEY);
  if(cached){try{data=JSON.parse(cached);data.subjects=data.subjects||[];data.tasks=data.tasks||[];data.schedule=data.schedule||{};}catch(e){}}
  try{
    setSync('Загрузка…');
    const r=await fetch(API_PATH);
    if(!r.ok)throw await r.text();
    const server=await r.json();
    data={subjects:server.subjects||[],tasks:server.tasks||[],schedule:server.schedule||{}};
    if(cached){
      const c=JSON.parse(cached);
      const cachedIds=new Set((c.tasks||[]).map(t=>t.id));
      const serverIds=new Set(data.tasks.map(t=>t.id));
      const localOnly=(c.tasks||[]).filter(t=>!serverIds.has(t.id));
      const serverOnly=data.tasks.filter(t=>!cachedIds.has(t.id));
      if(localOnly.length||serverOnly.length){
        data.tasks=[...data.tasks,...localOnly];
        save();
      }
    }
    try{localStorage.setItem(LS_KEY,JSON.stringify(data));}catch(e){}
    setSync('Синхронизировано','ok');
  }catch(e){
    setSync('Офлайн (локально)','err');
  }
  renderAll();
}

function storeLocal(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(data));return true;}
  catch(e){setSync('Хранилище переполнено','err');return false;}
}
function save(){
  storeLocal();
  setSync('Синхронизация…');
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    try{
      const r=await fetch(API_PATH,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
      if(!r.ok)throw await r.text();
      setSync('Синхронизировано','ok');
    }catch(e){setSync('Ошибка синхронизации','err');}
  },500);
}
function toggleTheme(){
  const html=document.documentElement;
  const cur=html.getAttribute('data-theme');
  const next=cur==='dark'?null:'dark';
  html.setAttribute('data-theme',next||'');
  localStorage.setItem('college_theme',next||'light');
}
function initTheme(){
  const saved=localStorage.getItem('college_theme');
  if(saved==='dark')document.documentElement.setAttribute('data-theme','dark');
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtSize(b){if(!b)return'';b=+b;if(b<1024)return b+' Б';if(b<1048576)return(b/1024).toFixed(1)+' КБ';return(b/1048576).toFixed(1)+' МБ';}
function pct(loaded,total){return total>0?Math.round(loaded/total*100)+'%':'';}
const TYPE_BY_EXT={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',svg:'image/svg+xml',avif:'image/avif',heic:'image/heic',heif:'image/heif',
  pdf:'application/pdf',txt:'text/plain',md:'text/markdown',csv:'text/csv',json:'application/json',zip:'application/zip',
  doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  ppt:'application/vnd.ms-powerpoint',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',
  odt:'application/vnd.oasis.opendocument.text',ods:'application/vnd.oasis.opendocument.spreadsheet',rtf:'application/rtf'};
function extOf(name){const m=String(name||'').toLowerCase().match(/\.([a-z0-9]{1,5})$/);return m?m[1]:'';}
function typeOfName(name){return TYPE_BY_EXT[extOf(name)]||'';}
function extOfType(type){if(type==='image/jpeg')return'jpg';for(const k in TYPE_BY_EXT)if(TYPE_BY_EXT[k]===type)return k;return'';}
async function toJpeg(file){
  const src=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=src;await img.decode();
    const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
    c.getContext('2d').drawImage(img,0,0);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));
  }finally{URL.revokeObjectURL(src);}
}
// Фото с телефона часто приходят как HEIC или без расширения: приводим к понятному виду
async function prepareFile(file){
  let name=file.name||'file',type=file.type||typeOfName(name),body=file;
  if(/^image\/hei[cf]$/.test(type)){
    try{const jpg=await toJpeg(file);if(jpg){body=jpg;type='image/jpeg';name=name.replace(/\.[^.]*$/,'')+'.jpg';}}catch{}
  }
  if(!extOf(name)&&extOfType(type))name+='.'+extOfType(type);
  return{name,type,body,size:body.size};
}
async function uploadFile(file,onProg){
  const{name,type,body}=await prepareFile(file);
  const t=await fetch('/api/blob/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'blob.generate-client-token',payload:{pathname:name,clientPayload:null,multipart:false}})});
  if(!t.ok){const body=await t.text();let msg;try{msg=JSON.parse(body).error}catch{msg=body}throw new Error(msg||('Ошибка '+t.status));}
  const{clientToken}=await t.json();
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('PUT','https://vercel.com/api/blob/?pathname='+encodeURIComponent(name));
    if(type)xhr.setRequestHeader('x-content-type',type);
    xhr.setRequestHeader('authorization','Bearer '+clientToken);
    xhr.setRequestHeader('x-vercel-blob-access','public');
    xhr.setRequestHeader('x-api-version','12');
    xhr.upload.onprogress=e=>{if(onProg&&e.lengthComputable)onProg(Math.round(e.loaded/e.total*100));};
    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300){try{resolve(Object.assign(JSON.parse(xhr.responseText),{name,size:body.size}));}catch{reject(new Error('Некорректный ответ сервера'));}}
      else{let msg;try{msg=JSON.parse(xhr.responseText).error?.message}catch{}reject(new Error(msg||('Ошибка '+xhr.status)));}
    };
    xhr.onerror=()=>reject(new Error('Нет соединения'));
    xhr.ontimeout=()=>reject(new Error('Таймаут загрузки'));
    xhr.timeout=120000;
    xhr.send(body);
  });
}
function chipHtml(f){return `📎 <span>${esc(f.name)}</span><span style="font-size:11px;color:var(--muted);margin:0 4px">${esc(f.size)}</span><button type="button" onclick="removePending(this,${esc(JSON.stringify(f.url))})">✕</button>`;}
function removePending(btn,url){pendingFiles=pendingFiles.filter(x=>x.url!==url);btn.parentElement.remove();}
function handleFiles(files){
  files=Array.from(files||[]);
  const el=document.getElementById('f_uploaded');
  const inp=document.getElementById('f_file');
  let active=files.length;if(active&&inp)inp.disabled=true;
  files.forEach(f=>{
    const chip=document.createElement('span');chip.className='uploaded-chip';
    chip.innerHTML=`<span style="min-width:22px;display:inline-block;text-align:center">⏳</span> <span>${esc(f.name)}</span><button type="button">✕</button>`;
    chip.lastChild.onclick=()=>chip.remove();
    el.appendChild(chip);
    const prog=chip.firstChild;
    uploadFile(f,pc=>{prog.textContent=pc+'%';}).then(r=>{
      if(!chip.isConnected)return;
      const item={name:r.name,size:fmtSize(r.size),url:r.url,pathname:r.pathname,contentType:r.contentType,downloadUrl:r.downloadUrl};
      pendingFiles.push(item);chip.innerHTML=chipHtml(item);
    }).catch(e=>{
      if(chip.isConnected){chip.innerHTML=`❌ <span>${esc(f.name)} — ${esc(e.message||'ошибка')}</span><button type="button">✕</button>`;chip.lastChild.onclick=()=>chip.remove();}
    }).then(()=>{if(--active<=0&&inp){inp.disabled=false;inp.value='';}});
  });
}
function handleDrop(e){const files=e.dataTransfer.files;if(files.length)handleFiles(files);}
function today(){const d=new Date();return d.toISOString().slice(0,10);}
function fmtDate(s){if(!s)return'';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});}
function daysDiff(dateStr){const t=new Date(dateStr+'T00:00:00').getTime();return Math.ceil((t-Date.now())/86400000);}
function subjectName(id){const s=data.subjects.find(x=>x.id===id);return s?s.name:'Без предмета';}
function during(s){return s&&s.start&&s.end&&s.start<=today()&&today()<=s.end;}

function taskStatus(t){
  if(t.done)return'done';
  if(t.due){
    const d=daysDiff(t.due);
    if(d<0)return'overdue';
    if(d<=3)return'soon';
  }
  return'current';
}

function setFilter(el,f){state.filter=f;document.querySelectorAll('#sidebar [data-filter]').forEach(a=>a.classList.remove('active'));el.classList.add('active');renderAll();}

function applyFilters(list){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const sf=document.getElementById('statusFilter').value;
  return list.filter(t=>{
    if(q){
      const hay=(t.title+' '+t.desc+' '+subjectName(t.subject)).toLowerCase();
      if(!hay.includes(q))return false;
    }
    const st=taskStatus(t);
    if(sf==='current'&&st==='done')return false;
    if(sf==='overdue'&&st!=='overdue')return false;
    if(sf==='done'&&st!=='done')return false;
    if(state.filter==='overdue'&&st!=='overdue')return false;
    if(state.filter==='upcoming'&&(!t.due||daysDiff(t.due)>7))return false;
    return true;
  }).sort((a,b)=>(a.done-b.done)||((a.due||'9999')<(b.due||'9999')?-1:1));
}

function entryCard(t){
  const st=taskStatus(t);
  const barPct=st==='done'?100:t.due?Math.max(0,Math.min(100,100-Math.round(daysDiff(t.due)/30*100))):0;
  const dueHtml=t.due?(st==='overdue'?`<span class="tag danger">Просрочено · ${fmtDate(t.due)}</span>`:
    st==='soon'?`<span class="tag soon">${fmtDate(t.due)} · осталось ${Math.abs(daysDiff(t.due))} дн.</span>`:
    `<span class="tag">Дедлайн: ${fmtDate(t.due)}</span>`):'<span class="tag">Без срока</span>';
  return `<div class="entry ${st==='overdue'?'overdue':''} ${st==='done'?'done':''}">
    <div class="meta">
      <span class="title">${esc(t.title)}</span>
      ${t.type==='exam'?'<span class="tag exam">Экзамен</span>':''}
      ${t.type==='note'?'<span class="tag">Заметка</span>':''}
      <span class="tag points">${esc(t.points?t.points+' баллов':'')}</span>
    </div>
    ${t.desc?`<div class="desc">${esc(t.desc)}</div>`:''}
    ${t.link?`<div><a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.link)}</a></div>`:''}
    ${t.files&&t.files.length?`<div class="files">${t.files.map((f,i)=>`<div class="file-row"><span class="file-ico">📎</span><a href="#" onclick="previewFile('${t.id}',${i});return false">${esc(f.name)}</a><span class="fsize">${f.size}</span><button class="btn sm ghost" onclick="previewFile('${t.id}',${i})">👁 Просмотр</button><button class="btn sm ghost" onclick="downloadFile('${t.id}',${i})">⬇</button></div>`).join('')}</div>`:''}
    <div class="row">
      ${dueHtml}
      <span class="duedate">${esc(subjectName(t.subject))}</span>
      <span style="flex:1"></span>
      <button class="btn sm ghost" onclick="toggleDone('${t.id}')">${t.done?'↩ Вернуть':'✓ Сделано'}</button>
      <button class="btn sm ghost" onclick="openModal('task','${t.id}')">✎</button>
      <button class="btn sm danger" onclick="delTask('${t.id}')">✕</button>
    </div>
    ${t.type!=='note'?'<div class="bar"><i style="width:'+barPct+'%"></i></div>':''}
  </div>`;
}

function entryEmpty(msg){return `<div class="empty"><div class="big">📚</div>${msg}</div>`;}

function renderHome(){
  const el=document.getElementById('content');
  const total=data.tasks.length;
  const done=data.tasks.filter(t=>t.done).length;
  const overdue=data.tasks.filter(t=>taskStatus(t)==='overdue').length;
  const upcoming=data.tasks.filter(t=>t.due&&daysDiff(t.due)>=0&&daysDiff(t.due)<=7).length;
  const pct=total?Math.round(done/total*100):0;

  document.getElementById('sidebar').querySelectorAll('[data-filter]').forEach(a=>a.classList.remove('active'));
  const groups=[
    {label:'Просрочено',list:data.tasks.filter(t=>taskStatus(t)==='overdue')},
    {label:'На этой неделе',list:data.tasks.filter(t=>t.due&&daysDiff(t.due)>=0&&daysDiff(t.due)<=7)},
    {label:'Без срока',list:data.tasks.filter(t=>!t.due&&!t.done)},
  ];
  let html=`<div class="subject-head"><div><h2>Все предметы</h2>
    <div style="font-size:13px;color:var(--muted)">${total} заданий · выполнено ${done} (${pct}%) · просрочено ${overdue}</div></div>
    <div class="bar" style="width:220px"><i style="width:${pct}%"></i></div>
    <div class="row">${['exam','note'].includes(state.filter)?'':''}<button class="btn ghost sm" onclick="openHome()">Сбросить</button></div></div>`;

  const filtered=applyFilters(data.tasks).filter(t=>!(t.done&&t.type!=='note'));
  const fArr=applyFilters(data.tasks);
  if(!fArr.length&&state.filter==='all'){
    html+=entryEmpty('Добавьте первый предмет и задание:<br><br><button class="btn" onclick="openModal(\'subject\')">+ Предмет</button> <button class="btn" onclick="openModal(\'task\')">+ Задание</button>');
  }else{
    const shown=filtered.length?filtered:fArr;
    html+=`<div class="entries">${shown.map(entryCard).join('')||entryEmpty('Ничего не найдено по вашему запросу.')}</div>`;
  }
  el.innerHTML=html;
}

  document.querySelectorAll('#sidebar li a').forEach(a=>a.classList.toggle('active',a.getAttribute('onclick')==="openSubject('"+id+"')"));
  const tasks=data.tasks.filter(t=>t.subject===id);
  const done=tasks.filter(t=>t.done).length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  const active=during(s);
  let html=`<div class="subject-head">
    <div><h2>${esc(s.name)}</h2>
      <div style="font-size:13px;color:var(--muted)">${esc(s.teacher||'')} ${s.room?'· каб. '+esc(s.room):''} ${s.start&&s.end?'· '+esc(s.start)+' — '+esc(s.end):''} ${active?'· <span style="color:var(--ok)">идёт сейчас</span>':''}</div>

      <button class="btn sm danger" onclick="delSubject('${s.id}')">✕</button>

function closeModal(){document.getElementById('modalBg').classList.remove('open');}
function val(id){return document.getElementById(id).value.trim();}

function saveSubject(id){
  const name=val('f_name');if(!name){toast('Введите название');return;}
  const obj={id:id||uid(),name,teacher:val('f_teacher'),room:val('f_room'),start:val('f_start'),end:val('f_end'),notes:val('f_notes')};
  if(id){const i=data.subjects.findIndex(x=>x.id===id);data.subjects[i]=obj;}
  else data.subjects.push(obj);
  save();closeModal();toast('Сохранено');state.subject=obj.id;renderAll();
}

function saveTask(id){
  const title=val('f_title');if(!title){toast('Введите название');return;}
  const subj=val('f_subject');if(!subj){toast('Сначала добавьте предмет');closeModal();return;}
  const obj={id:id||uid(),title,subject:subj,desc:val('f_desc'),link:val('f_link'),due:val('f_due'),type:val('f_type'),points:val('f_points'),files:pendingFiles.slice(),done:false};
  if(id){const i=data.tasks.findIndex(x=>x.id===id);obj.done=data.tasks[i].done;data.tasks[i]=obj;}
  else data.tasks.push(obj);
  save();closeModal();toast('Сохранено');renderAll();
}

function toggleDone(id){const t=data.tasks.find(x=>x.id===id);t.done=!t.done;save();renderAll();}
function delTask(id){if(!confirm('Удалить задание?'))return;data.tasks=data.tasks.filter(x=>x.id!==id);save();renderAll();toast('Удалено');}
function delSubject(id){
  if(!confirm('Удалить предмет и все его задания?'))return;
  data.subjects=data.subjects.filter(x=>x.id!==id);
  data.tasks=data.tasks.filter(x=>x.subject!==id);
  save();state.subject=null;state.view='all';renderAll();toast('Удалено');
}

function exportData(){

  a.download='college-backup-'+today()+'.json';

}

function mimeOf(f){
  const ct=String(f.contentType||f.type||'').split(';')[0].trim();
  if(ct&&ct!=='application/octet-stream')return ct;
  return typeOfName(f.name)||typeOfName(f.pathname)||'application/octet-stream';
}
function isImage(f){return /^image\//.test(mimeOf(f));}
function isPdf(f){return mimeOf(f)==='application/pdf'||/\.pdf$/i.test(f.name);}
function isText(f){return /\.(txt|md|csv|log|json|js|html|css|xml|sql|py|ts|java|c|cpp|h|ini|cfg|yml|yaml|sh|bat)$/i.test(f.name);}
function isXlsx(f){return /\.(xlsx|xlsm|xls|ods)$/i.test(f.name);}
function fileAt(tid,fi){const t=data.tasks.find(x=>x.id===tid);return t&&t.files&&t.files[fi]||null;}
function tgApp(){const w=window.Telegram&&window.Telegram.WebApp;return w&&w.initData?w:null;}
async function downloadFile(tid,fi){
  const f=fileAt(tid,fi);if(!f)return;
  const u=f.url||f.downloadUrl;if(!u){toast('Файл недоступен');return;}
  const dl=f.downloadUrl||(u+(u.includes('?')?'&':'?')+'download=1');
  // В мини-приложении Telegram обычное скачивание не работает: просим Telegram скачать файл сам
  const tg=tgApp();
  if(tg){
    if(tg.downloadFile&&tg.isVersionAtLeast&&tg.isVersionAtLeast('8.0')){
      try{tg.downloadFile({url:u,file_name:f.name||'file'});return;}catch(e){}
    }
    tg.openLink(dl);return;
  }
  toast('Скачивание…');
  try{
    const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);
    const href=URL.createObjectURL(await r.blob());
    const a=document.createElement('a');a.href=href;a.download=f.name||'file';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(href),60000);
  }catch(e){
    // запасной вариант: Vercel Blob сам отдаёт файл как вложение
    window.open(dl,'_blank','noopener');
  }
}
function closePreview(){document.getElementById('pvBg').classList.remove('open');}
function loadScript(srcs,ok,err){
  if(!srcs.length){if(err)err();return;}
  const s=document.createElement('script');
  const to=setTimeout(()=>{s.onload=s.onerror=null;s.remove();tryNext();},9000);
  function tryNext(){
    s.remove();
    const rest=srcs.slice(1);
    if(!rest.length){if(err)err();return;}
    loadScript(rest,ok,err);
  }
  s.src=srcs[0];
  s.onload=()=>{clearTimeout(to);ok();};
  s.onerror=()=>{clearTimeout(to);tryNext();};
  document.head.appendChild(s);
}
async function fetchBytes(url){
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.arrayBuffer();
}
function renderPdf(url,bodyEl){
  bodyEl.innerHTML='';
  const box=document.createElement('div');
  box.className='pdf-box';
  box.innerHTML=`<div class="pdf-controls">
      <button class="pdf-btn" data-act="prev">◀</button>
      <span>Стр. <b data-pg>1</b> из <b data-total>…</b></span>
      <button class="pdf-btn" data-act="next">▶</button>
      <span style="color:var(--muted)">·</span>
      <button class="pdf-btn" data-act="zoomout">−</button>
      <button class="pdf-btn" data-act="zoomin">+</button>
    </div>
    <div class="pdf-page"><canvas></canvas></div>`;
  bodyEl.appendChild(box);
  const canvas=box.querySelector('canvas');
  const pageEl=box.querySelector('[data-pg]');
  const totalEl=box.querySelector('[data-total]');
  const ctx=canvas.getContext('2d');
  let pdf=null,pageNum=1,scale=1.4,zoom=1;
  box.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',e=>{
    const act=e.currentTarget.dataset.act;
    if(act==='prev')show(pageNum-1);
    else if(act==='next')show(pageNum+1);
    else if(act==='zoomout'){zoom=Math.max(.4,zoom-.2);renderPage();}
    else if(act==='zoomin'){zoom=Math.min(3,zoom+.2);renderPage();}
  }));
  function renderPage(){
    if(!pdf)return;
    pdf.getPage(pageNum).then(pg=>{
      const vp=pg.getViewport({scale:scale*zoom});
      const dpr=window.devicePixelRatio||1;
      canvas.width=Math.floor(vp.width*dpr);
      canvas.height=Math.floor(vp.height*dpr);
      canvas.style.width=Math.floor(vp.width)+'px';
      canvas.style.height=Math.floor(vp.height)+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,vp.width,vp.height);
      ctx.scale(zoom,zoom);
      pg.render({canvasContext:ctx,viewport:pg.getViewport({scale:scale})}).promise.then(()=>{});
    });
  }
  function show(n){
    if(!pdf)return;
    if(n<1||n>pdf.numPages)return;
    pageNum=n;
    pageEl.textContent=n;
    totalEl.textContent=pdf.numPages;
    renderPage();
  }
  function touchStart(x){box._tx=x;}
  function touchEnd(x){
    if(box._tx==null)return;
    const dx=x-box._tx;
    if(Math.abs(dx)>40){if(dx<0)show(pageNum+1);else show(pageNum-1);}
    box._tx=null;
  }
  box.querySelector('.pdf-page').addEventListener('touchstart',e=>touchStart(e.touches[0].clientX),{passive:true});
  box.querySelector('.pdf-page').addEventListener('touchend',e=>touchEnd(e.changedTouches[0].clientX),{passive:true});
  if(!window.pdfjsLib){
    loadScript(
      ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
       'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js',
       'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'],
      ()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=(window.pdfjsLib.GlobalWorkerOptions.workerSrc)||
             'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';loadPdf();},
      ()=>{box.innerHTML='<div style="text-align:center;padding:30px;color:var(--muted)">Не удалось загрузить просмотрщик PDF.<br>Проверьте подключение к интернету.</div>';}
    );
  }else loadPdf();
  async function loadPdf(){
    try{
      const bytes=await fetchBytes(url);
      pdf=await pdfjsLib.getDocument({data:bytes}).promise;
      totalEl.textContent=pdf.numPages;
      show(1);
    }catch(e){
      box.innerHTML='<div style="text-align:center;padding:30px;color:var(--danger)">Не удалось открыть PDF: '+esc(e.message||'ошибка')+'</div>';
    }
  }
}
function renderXlsx(url,bodyEl){
  if(!window.XLSX){
    loadScript(
      ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
       'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
       'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'],
      ()=>renderXlsx(url,bodyEl),
      ()=>{bodyEl.innerHTML='<div style="text-align:center;padding:30px;color:var(--muted)">Не удалось загрузить библиотеку для просмотра таблиц.<br>Проверьте подключение к интернету.</div>';}
    );
    return;
  }
  (async()=>{
    try{
      const bytes=await fetchBytes(url);
      const wb=XLSX.read(new Uint8Array(bytes),{type:'array',cellDates:true,dateNF:'dd.mm.yyyy'});
      const sheets=wb.SheetNames;
      let cur=0;
      let zoom=+(lsGet('xls_zoom')||(innerWidth<760?13:15)),wrap=lsGet('xls_wrap')!=='0';
      bodyEl.innerHTML=`<div class="xls-bar">
          <div class="xls-tabs"></div>
          <div class="xls-tools">
            <button class="xls-btn" data-act="zo" title="Мельче">A−</button>
            <button class="xls-btn" data-act="zi" title="Крупнее">A+</button>
            <button class="xls-btn" data-act="wrap" title="Переносить текст в ячейках">↵ Перенос</button>
          </div>
        </div>
        <div class="xls-wrap"></div><div class="xls-note"></div>`;
      const tabsEl=bodyEl.querySelector('.xls-tabs'),wrapEl=bodyEl.querySelector('.xls-wrap'),noteEl=bodyEl.querySelector('.xls-note');
      const wrapBtn=bodyEl.querySelector('[data-act="wrap"]');
      function applyView(){
        wrapEl.style.setProperty('--xz',zoom+'px');
        wrapEl.classList.toggle('nowrap',!wrap);
        wrapBtn.classList.toggle('on',wrap);
      }
      bodyEl.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
        const a=b.dataset.act;
        if(a==='zo')zoom=Math.max(11,zoom-1);
        else if(a==='zi')zoom=Math.min(24,zoom+1);
        else wrap=!wrap;
        lsSet('xls_zoom',zoom);lsSet('xls_wrap',wrap?'1':'0');applyView();
      });
      function show(i){
        cur=i;
        tabsEl.innerHTML=sheets.length>1?sheets.map((n,j)=>`<button class="${j===i?'active':''}" data-i="${j}">${esc(n)}</button>`).join(''):'';
        tabsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>show(+b.dataset.i));
        const r=sheetToHtml(wb.Sheets[sheets[i]]);
        wrapEl.innerHTML=r.html;noteEl.textContent=r.note;wrapEl.scrollTop=0;wrapEl.scrollLeft=0;
      }
      applyView();show(0);
    }catch(e){
      bodyEl.innerHTML=`<div style="text-align:center;padding:30px;color:var(--danger)">Не удалось прочитать файл: ${esc(e.message||'ошибка')}</div>`;
    }
  })();
}
// Лист Excel -> HTML-таблица: учитывает объединённые ячейки, убирает пустые столбцы и хвосты
function sheetToHtml(ws){
  const empty={html:'<div class="xls-empty">Лист пуст</div>',note:''};
  if(!ws||!ws['!ref'])return empty;
  const MAX_ROWS=1000,MAX_COLS=60;
  const rg=XLSX.utils.decode_range(ws['!ref']);
  const lastR=Math.min(rg.e.r,rg.s.r+20000),lastC=Math.min(rg.e.c,rg.s.c+300);
  const text=cell=>{
    if(!cell||cell.v==null)return'';
    if(cell.w!=null)return String(cell.w);
    if(cell.v instanceof Date)return cell.v.toLocaleDateString('ru-RU');
    if(typeof cell.v==='number')return cell.v.toLocaleString('ru-RU',{maximumFractionDigits:4});
    return String(cell.v);
  };
  let maxR=-1;const usedCols=new Set();
  for(let r=rg.s.r;r<=lastR;r++)for(let c=rg.s.c;c<=lastC;c++){
    const cell=ws[XLSX.utils.encode_cell({r,c})];
    if(cell&&text(cell).trim()!==''){if(r>maxR)maxR=r;usedCols.add(c);}
  }
  if(maxR<0)return empty;
  const merges={},covered=new Set();
  (ws['!merges']||[]).forEach(m=>{
    if(m.s.r>maxR)return;
    merges[m.s.r+','+m.s.c]=m;
    for(let r=m.s.r;r<=m.e.r;r++)for(let c=m.s.c;c<=m.e.c;c++)if(r!==m.s.r||c!==m.s.c)covered.add(r+','+c);
  });
  const cols=[...usedCols].sort((a,b)=>a-b);
  const shownCols=cols.slice(0,MAX_COLS),colSet=new Set(shownCols);
  let firstR=rg.s.r;
  while(firstR<maxR&&!shownCols.some(c=>text(ws[XLSX.utils.encode_cell({r:firstR,c})]).trim()!==''))firstR++;
  const endR=Math.min(maxR,firstR+MAX_ROWS-1);
  // ширина столбца по самому длинному значению (без шапки), чтобы длинный текст не превращался в узкую «колбасу»
  const width={};
  for(const c of shownCols){
    let len=0;
    for(let r=firstR+1;r<=endR;r++){const k=r+','+c;if(covered.has(k)||merges[k])continue;len=Math.max(len,text(ws[XLSX.utils.encode_cell({r,c})]).length);}
    width[c]=Math.max(4,Math.min(16,Math.round(len*0.55)));
  }
  let h='<table class="xls">';
  for(let r=firstR;r<=endR;r++){
    const isEmpty=!shownCols.some(c=>text(ws[XLSX.utils.encode_cell({r,c})]).trim()!=='');
    h+=`<tr class="${r===firstR?'hd':''}${isEmpty?' gap':''}">`;
    for(const c of shownCols){
      const key=r+','+c;
      if(covered.has(key))continue;
      const cell=ws[XLSX.utils.encode_cell({r,c})];
      const m=merges[key];
      let attrs='';
      if(m){
        const cs=shownCols.filter(x=>x>=m.s.c&&x<=m.e.c).length;
        const rs=Math.min(m.e.r,endR)-r+1;
        if(cs>1)attrs+=` colspan="${cs}"`;
        if(rs>1)attrs+=` rowspan="${rs}"`;
      }
      const t=text(cell);
      const num=cell&&cell.t==='n';
      if(!m)attrs+=` style="min-width:${width[c]}em"`;
      h+=`<td${attrs}${num?' class="num"':''}>${esc(t)}</td>`;
    }
    h+='</tr>';
  }
  h+='</table>';
  const totalRows=maxR-firstR+1;
  const note=(totalRows>MAX_ROWS||cols.length>MAX_COLS)?`Показана часть таблицы: ${endR-firstR+1} из ${totalRows} строк, ${shownCols.length} из ${cols.length} столбцов. Полностью — в скачанном файле.`:'';
  return{html:h,note};
}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function previewFile(tid,fi){
  const t=data.tasks.find(x=>x.id===tid);
  if(!t||!t.files||fi<0||fi>=t.files.length)return;
  const f=t.files[fi];
  const u=f.url||f.downloadUrl||'';
  if(!u){toast('Файл недоступен');return;}
  const bg=document.getElementById('pvBg');
  const pv=document.getElementById('pv');
  let inner;
  if(isImage(f))inner=`<img src="${esc(u)}" alt="${esc(f.name)}">`;
  else if(isPdf(f)){
    inner=`<div style="text-align:center;padding:30px"><em>Загрузка PDF…</em></div>`;
    pv.innerHTML=`<div class="pv-head"><strong>${esc(f.name)}</strong><span style="color:var(--muted);font-size:13px">${esc(f.size)}</span><span style="flex:1"></span><button class="btn ghost sm" onclick="downloadFile('${tid}',${fi})">⬇ Скачать</button><button class="btn sm" onclick="closePreview()">Закрыть</button></div><div class="pv-body">${inner}</div>`;
    bg.classList.add('open');
    renderPdf(u,pv.querySelector('.pv-body'));
    return;
  }
  else if(isText(f)){
    inner=`<div style="text-align:center;padding:30px"><em>Загрузка…</em></div>`;
    pv.innerHTML=`<div class="pv-head"><strong>${esc(f.name)}</strong><span style="color:var(--muted);font-size:13px">${esc(f.size)}</span><span style="flex:1"></span><button class="btn ghost sm" onclick="downloadFile('${tid}',${fi})">⬇ Скачать</button><button class="btn sm" onclick="closePreview()">Закрыть</button></div><div class="pv-body">${inner}</div>`;
    bg.classList.add('open');
    fetch(u).then(r=>r.text()).then(txt=>{pv.querySelector('.pv-body').innerHTML=`<pre>${esc(txt)}</pre>`;}).catch(()=>{pv.querySelector('.pv-body').innerHTML='<div style="text-align:center;padding:30px;color:var(--danger)">Не удалось загрузить файл</div>';});
    return;
  }else if(isXlsx(f)){
    inner=`<div style="text-align:center;padding:30px"><em>Загрузка таблицы…</em></div>`;
    pv.innerHTML=`<div class="pv-head"><strong>${esc(f.name)}</strong><span style="color:var(--muted);font-size:13px">${esc(f.size)}</span><span style="flex:1"></span><button class="btn ghost sm" onclick="downloadFile('${tid}',${fi})">⬇ Скачать</button><button class="btn sm" onclick="closePreview()">Закрыть</button></div><div class="pv-body">${inner}</div>`;
    bg.classList.add('open');
    renderXlsx(u,pv.querySelector('.pv-body'));
    return;
  }else{
    const m=mimeOf(f);
    inner=m.startsWith('video/')||m.startsWith('audio/')?`<video src="${esc(u)}" controls style="max-width:100%;max-height:70vh;border-radius:8px"></video>`:
          `<iframe src="${esc(u)}" title="${esc(f.name)}" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe>`;
  }
  pv.innerHTML=`<div class="pv-head"><strong>${esc(f.name)}</strong><span style="color:var(--muted);font-size:13px">${esc(f.size)}</span><span style="flex:1"></span><button class="btn ghost sm" onclick="downloadFile('${tid}',${fi})">⬇ Скачать</button><button class="btn sm" onclick="closePreview()">Закрыть</button></div><div class="pv-body">${inner}</div>`;
  bg.classList.add('open');
}

const SCH_LS=null;
function startOfWeek(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function fmtShort(d){return d.toLocaleDateString('ru-RU',{day:'numeric',month:'numeric'});}
function saveSch(){save();}
function openSchedule(){renderSch();document.getElementById('schBg').classList.add('open');}
function closeSch(){document.getElementById('schBg').classList.remove('open');}
function renderSch(){
  const el=document.getElementById('sch');
  const base=data.schedule.base?new Date(data.schedule.base):startOfWeek(new Date());
  const days=[];
  for(let i=0;i<7;i++){const d=addDays(base,i);days.push({d,iso:d.toISOString().slice(0,10),label:d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'numeric'})});}
  const todayIso=today();
  const lessons=data.schedule.lessons||{};
  const par=((Math.floor((base.getTime()-new Date(base.getFullYear(),0,1).getTime())/604800000)+1)%2)===0?'even':'odd';
  const parLabel=par==='odd'?'Нечётная неделя':'Чётная неделя';
  let html=`<div class="sch-toolbar">
    <div><h2 style="margin:0">📅 Расписание на неделю</h2><div style="font-size:13px;color:var(--muted)">${fmtShort(days[0].d)} — ${fmtShort(days[6].d)} · <span style="color:${par==='odd'?'var(--soon)':'var(--points)'};font-weight:600">${parLabel}</span></div></div>
    <div class="row"><button class="btn ghost sm" onclick="schNav(-7)">◀ Прошлая</button><button class="btn ghost sm" onclick="schNav(0)">Текущая неделя</button><button class="btn ghost sm" onclick="schNav(7)">Следующая ▶</button><button class="btn sm" onclick="closeSch()">Закрыть</button></div>
  </div>`;
  html+=`<div class="sch-grid">`;
  days.forEach((day,i)=>{
    const list=lessons[day.iso]||[];
    const isToday=day.iso===todayIso;
    html+=`<div class="sch-day ${isToday?'today':''}"><h4>${esc(day.label)}<button class="sch-add" title="Добавить урок" onclick="schAdd('${day.iso}')">+</button></h4>`;
    list.sort((a,b)=>a.start.localeCompare(b.start)).forEach((l,j)=>{
      const subj=data.subjects.find(s=>s.id===l.subject)||{};
      const name=l.title||subj.name||'Без названия';
      const room=l.room||subj.room||'';
      const lw=l.week||'';
      const onWk=!lw||lw===par;
      const wkBadge=lw==='even'?'<span class="tag points" style="font-size:10px;padding:1px 6px">чёт.</span>':lw==='odd'?'<span class="tag soon" style="font-size:10px;padding:1px 6px">нечёт.</span>':'';
      html+=`<div class="sch-lesson ${onWk?'':'off'}" onclick="schEdit('${day.iso}',${j})" title="Изменить">
        <button class="sch-del" onclick="event.stopPropagation();schDel('${day.iso}','${l.uid}')">✕</button>
        <div class="t">${l.start?esc(l.start):'—'}${l.end?'–'+esc(l.end):''} ${wkBadge}</div>
        <div>${esc(name)}</div>${room?`<div class="rm">каб. ${esc(room)}</div>`:''}</div>`;
    });
    if(!list.length)html+=`<div style="font-size:12px;color:var(--muted)">Нет пар</div>`;
    html+=`</div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}
function schNav(delta){
  const base=data.schedule.base?new Date(data.schedule.base):startOfWeek(new Date());
  data.schedule.base=addDays(base,delta).toISOString().slice(0,10);
  saveSch();renderSch();
}
function schEnsure(day){if(!data.schedule.lessons)data.schedule.lessons={};if(!data.schedule.lessons[day])data.schedule.lessons[day]=[];return data.schedule.lessons[day];}
function schAdd(day){
  const t={uid:uid(),start:'',end:'',title:'',subject:'',room:'',week:''};
  schEnsure(day).push(t);
  saveSch();renderSch();
}
function schDel(day,uid){data.schedule.lessons[day]=(data.schedule.lessons[day]||[]).filter(l=>l.uid!==uid);saveSch();renderSch();}
function schEdit(day,idx){
  const list=schEnsure(day);
  const l=list[idx]||{uid:uid(),start:'',end:'',title:'',subject:'',room:''};
  const subjOpts=data.subjects.map(s=>`<option value="${s.id}" ${l.subject===s.id?'selected':''}>${esc(s.name)}</option>`).join('');
  const bg=document.getElementById('schBg');
  const el=document.getElementById('sch');
  const prev=el.innerHTML;
  el.innerHTML=`<div class="sch-toolbar"><h2 style="margin:0">Урок · ${esc(day)}</h2><button class="btn ghost sm" onclick="renderSch()">← Назад</button></div>
    <div class="field"><label>Название</label><input id="sl_title" value="${esc(l.title||'')}" placeholder="Например: Математика"></div>
    <div class="field"><label>Предмет</label><select id="sl_subject"><option value="">— без предмета —</option>${subjOpts||''}</select></div>
    <div class="field"><label>Время</label><div class="row"><input id="sl_start" type="time" value="${esc(l.start||'')}" style="flex:1"><span>—</span><input id="sl_end" type="time" value="${esc(l.end||'')}" style="flex:1"></div></div>
    <div class="field"><label>Кабинет</label><input id="sl_room" value="${esc(l.room||'')}" placeholder="Например: 203"></div>
    <div class="field"><label>Неделя</label><select id="sl_week">
      <option value="" ${!l.week?'selected':''}>Каждую неделю</option>
      <option value="odd" ${l.week==='odd'?'selected':''}>Нечётная</option>
      <option value="even" ${l.week==='even'?'selected':''}>Чётная</option>
    </select></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="renderSch()">Отмена</button><button class="btn" onclick="schSave('${day}','${l.uid}')">Сохранить</button></div>`;
}
function schSave(day,uid){
  const list=schEnsure(day);
  const l=list.find(x=>x.uid===uid);
  if(!l)return;
  l.title=document.getElementById('sl_title').value.trim();
  l.subject=document.getElementById('sl_subject').value;
  l.start=document.getElementById('sl_start').value;
  l.end=document.getElementById('sl_end').value;
  l.room=document.getElementById('sl_room').value.trim();
  l.week=document.getElementById('sl_week').value;
  if(!l.title&&!l.subject&&!l.start&&!l.room){schDel(day,uid);return;}
  saveSch();renderSch();
}
